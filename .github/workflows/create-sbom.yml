name: Create SBOM (Syft, Hadolint, Dockle)

on:
  workflow_call:
    secrets:
      REGISTRY_PASSWORD:
        description: "Password or token for container registry (if using IMAGE input)"
        required: false
    inputs:
      project_name:
        description: 'Tag used to name the output artifacts (sbom-cdx-<project_name>, hadolint-json-report-<project_name>, dockle-report-<project_name>). Must match the value passed to scan-sbom.yml/upload-sbom.yml so they can find these artifacts.'
        type: string
        required: true
      FILE:
        description: 'Path to input file for SBOM generation (e.g. Dockerfile or binary) - mutually exclusive with IMAGE and PATH'
        required: false
        type: string
      PATH:
        description: 'Path to directory for SBOM generation'
        required: false
        type: string
      IMAGE:
        description: 'Container image reference (e.g. myregistry/myapp:1.0) for sbom generation - mutually exclusive with FILE and PATH. If the registry requires authentication, provide credentials via REGISTRY_USERNAME and REGISTRY_PASSWORD inputs.'
        required: false
        type: string
      REGISTRY_USERNAME:
        description: 'User name for container registry (if using IMAGE input)'
        type: string
        required: false
      REGISTRY_REGION:
        description: 'Region for container registry  (if using IMAGE input and REGISTRY is ECR)'
        type: string
        required: false
      digest_tool:
        description: 'Tool used to retrieve the image RepoDigest SHA-256. Use "skopeo" (default, no credential storage) or "docker" (docker login + pull + inspect).'
        type: string
        required: false
        default: 'skopeo'
      dockerfile_path:
        description: 'Path to Dockerfile for hadolint analysis. Leave empty to auto-extract from image or history when IMAGE is provided.'
        type: string
        required: false
        default: ''
      generate_sbom:
        description: 'Generate a CycloneDX SBOM with Syft (true/false)'
        type: string
        required: false
        default: 'true'
      run_hadolint:
        description: 'Lint the Dockerfile with Hadolint (true/false) - only applies when IMAGE is provided'
        type: string
        required: false
        default: 'true'
      run_dockle:
        description: 'Scan the image with Dockle (true/false) - only applies when IMAGE is provided'
        type: string
        required: false
        default: 'true'

jobs:
  create-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          if [[ -z "${{ inputs.FILE }}" && -z "${{ inputs.PATH }}" && -z "${{ inputs.IMAGE }}" ]]; then
            echo "Error: Either FILE, PATH, OR IMAGE is required."
            exit 1
          fi
          if [[ -n "${{ inputs.IMAGE }}" && -z "${{ inputs.REGISTRY_USERNAME }}" ]]; then
            echo "Error: REGISTRY_USERNAME is required for image scans."
            exit 1
          fi
          if [[ -n "${{ inputs.IMAGE }}" && -z "${{ secrets.REGISTRY_PASSWORD }}" ]]; then
            echo "Error: REGISTRY_PASSWORD is required for image scans."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create Syft config
        if: ${{ inputs.generate_sbom == 'true' }}
        run: |
          cat > .syft.yaml << 'EOF'
          file:
            metadata:
              digests:
                - sha256
          EOF

      - name: Compute scan flags
        id: flags
        run: |
          NEED_PULL=false
          NEED_TAR=false
          NEED_CLEANUP=false
          if [[ -n "${{ inputs.IMAGE }}" ]]; then
            if [[ "${{ inputs.generate_sbom }}" == "true" || "${{ inputs.run_hadolint }}" == "true" || "${{ inputs.run_dockle }}" == "true" ]]; then
              NEED_PULL=true
            fi
            if [[ "${{ inputs.generate_sbom }}" == "true" || "${{ inputs.run_dockle }}" == "true" ]]; then
              NEED_TAR=true
            fi
            if [[ "$NEED_PULL" == "true" ]] && ! { [[ "${{ inputs.generate_sbom }}" == "true" ]] && [[ "${{ inputs.digest_tool }}" == "docker" ]]; }; then
              NEED_CLEANUP=true
            fi
          fi
          echo "need_pull=$NEED_PULL" >> $GITHUB_OUTPUT
          echo "need_tar=$NEED_TAR" >> $GITHUB_OUTPUT
          echo "need_cleanup=$NEED_CLEANUP" >> $GITHUB_OUTPUT

      - name: Cache Hadolint
        if: ${{ inputs.run_hadolint == 'true' && inputs.IMAGE != '' }}
        id: cache-hadolint
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/hadolint
          key: hadolint-${{ runner.os }}-v2.14.0

      - name: Install Hadolint
        if: ${{ inputs.run_hadolint == 'true' && inputs.IMAGE != '' && steps.cache-hadolint.outputs.cache-hit != 'true' }}
        run: |
          curl -sSL "https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Ensure skopeo is available
        if: ${{ inputs.generate_sbom == 'true' && inputs.IMAGE != '' && inputs.digest_tool != 'docker' }}
        run: command -v skopeo >/dev/null 2>&1 || sudo apt-get install -y -q skopeo

      - name: Determine Container Registry
        id: registry
        if: ${{ steps.flags.outputs.need_pull == 'true' && inputs.REGISTRY_USERNAME != '' }}
        run: |
          HOST=$(echo "${{ inputs.IMAGE }}" | cut -d'/' -f1)
          # Bare image names (e.g. "nginx:latest") have no dot or colon in the first segment
          if [[ "$HOST" != *.* && "$HOST" != *:* ]]; then
            TYPE="dockerhub"
            HOST="docker.io"
          elif [[ "$HOST" == *".amazonaws.com" ]]; then
            TYPE="ecr"
          elif [[ "$HOST" == *".azurecr.io" ]]; then
            TYPE="acr"
          elif [[ "$HOST" == "gcr.io" || "$HOST" == *".gcr.io" ]]; then
            TYPE="gcr"
          elif [[ "$HOST" == "ghcr.io" ]]; then
            TYPE="ghcr"
          elif [[ "$HOST" == "docker.io" ]]; then
            TYPE="dockerhub"
          else
            TYPE="harbor"
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "Registry type: $TYPE, host: $HOST"

      - name: Login to Docker-Compatible Registry
        if: ${{ steps.flags.outputs.need_pull == 'true' && inputs.REGISTRY_USERNAME != '' && contains(fromJSON('["dockerhub","ghcr","gcr","harbor"]'), steps.registry.outputs.type) }}
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ inputs.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Configure AWS Credentials
        if: ${{ steps.flags.outputs.need_pull == 'true' && inputs.REGISTRY_USERNAME != '' && steps.registry.outputs.type == 'ecr' && inputs.REGISTRY_USERNAME != 'AWS' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ inputs.REGISTRY_USERNAME }}
          aws-secret-access-key: ${{ secrets.REGISTRY_PASSWORD }}
          aws-region: ${{ inputs.REGISTRY_REGION }}

      - name: Login to Amazon ECR
        if: ${{ steps.flags.outputs.need_pull == 'true' && inputs.REGISTRY_USERNAME != '' && steps.registry.outputs.type == 'ecr' && inputs.REGISTRY_USERNAME != 'AWS' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Amazon ECR (pre-obtained token)
        if: ${{ steps.flags.outputs.need_pull == 'true' && inputs.REGISTRY_USERNAME == 'AWS' && steps.registry.outputs.type == 'ecr' }}
        env:
          ECR_TOKEN: ${{ secrets.REGISTRY_PASSWORD }}
          ECR_REGISTRY: ${{ steps.registry.outputs.host }}
        run: echo "$ECR_TOKEN" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Login to Azure Container Registry
        if: ${{ steps.flags.outputs.need_pull == 'true' && inputs.REGISTRY_USERNAME != '' && steps.registry.outputs.type == 'acr' }}
        uses: azure/docker-login@v2
        with:
          login-server: ${{ steps.registry.outputs.host }}
          username: ${{ inputs.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Pull image
        if: ${{ steps.flags.outputs.need_pull == 'true' }}
        run: docker pull "${{ inputs.IMAGE }}"

      - name: Extract Dockerfile from Image
        id: extract-dockerfile
        if: ${{ inputs.run_hadolint == 'true' && inputs.IMAGE != '' && inputs.dockerfile_path == '' }}
        run: |
          IMAGE="${{ inputs.IMAGE }}"
          DOCKERFILE_PATH="./extracted-dockerfile"
          CONTAINER_ID=$(docker create "$IMAGE")
          FOUND=false
          for CANDIDATE in /Dockerfile /docker/Dockerfile /app/Dockerfile; do
            if docker cp "${CONTAINER_ID}:${CANDIDATE}" "$DOCKERFILE_PATH" 2>/dev/null; then
              echo "Extracted Dockerfile from image at ${CANDIDATE}."
              FOUND=true
              break
            fi
          done
          docker rm "$CONTAINER_ID" > /dev/null
          if [ "$FOUND" = "false" ]; then
            echo "No Dockerfile found inside image; reconstructing from docker history..."
            docker history --no-trunc --format "{{.CreatedBy}}" "$IMAGE" \
              | tac \
              | sed -E \
                  -e '/^$/d' \
                  -e 's/^\|[0-9]+ .+\/bin\/sh/\/bin\/sh/' \
                  -e 's|^/bin/sh -c #\(nop\) +||' \
                  -e 's|^/bin/sh -c |RUN |' \
                  -e 's/ #.*$//' \
              | grep -E '^(FROM|RUN|CMD|LABEL|EXPOSE|ENV|ADD|COPY|ENTRYPOINT|VOLUME|USER|WORKDIR|ARG|ONBUILD|STOPSIGNAL|HEALTHCHECK|SHELL|MAINTAINER)( |\[|$)' \
              | grep -vE '^(COPY|ADD) file:' \
              > "$DOCKERFILE_PATH"
            # hadolint requires FROM as the first instruction; prepend a placeholder if history didn't include one
            if ! grep -q '^FROM ' "$DOCKERFILE_PATH"; then
              echo 'FROM scratch' | cat - "$DOCKERFILE_PATH" > /tmp/df_tmp && mv /tmp/df_tmp "$DOCKERFILE_PATH"
            fi
            if [ ! -s "$DOCKERFILE_PATH" ]; then
              echo "::warning::Could not reconstruct Dockerfile from history; skipping hadolint."
              echo "dockerfile_path=" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Reconstructed Dockerfile from image history."
          fi
          echo "dockerfile_path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT

      - name: Save image to tar
        if: ${{ steps.flags.outputs.need_tar == 'true' }}
        run: docker save "${{ inputs.IMAGE }}" -o /tmp/sbom-image.tar

      - name: Free image from Docker daemon
        if: ${{ steps.flags.outputs.need_cleanup == 'true' }}
        run: |
          # Everything downstream reads /tmp/sbom-image.tar (or nothing, if only
          # hadolint was requested). Drop the daemon's copy now to cap peak disk
          # usage. Skipped when generate_sbom=true and digest_tool=docker, since
          # that path still needs `docker inspect` against the local image later.
          docker rmi "${{ inputs.IMAGE }}" || true

      - name: Create SBOM With Syft Image Scan
        if: ${{ inputs.generate_sbom == 'true' && inputs.IMAGE != '' }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft scan docker-archive:/tmp/sbom-image.tar \
            --config .syft.yaml \
            -o cyclonedx-json \
            --file "${{ github.event.repository.name }}-sbom.cdx.json"

      - name: Create SBOM With Syft File Scan
        if: ${{ inputs.generate_sbom == 'true' && inputs.FILE != '' }}
        uses: anchore/sbom-action@v0
        with:
          file: ${{ inputs.FILE }}
          format: cyclonedx-json
          output-file: "${{ github.event.repository.name }}-sbom.cdx.json"
          config: .syft.yaml

      - name: Create SBOM With Syft Path Scan
        if: ${{ inputs.generate_sbom == 'true' && inputs.PATH != '' }}
        uses: anchore/sbom-action@v0
        with:
          path: ${{ inputs.PATH }}
          format: cyclonedx-json
          output-file: "${{ github.event.repository.name }}-sbom.cdx.json"
          config: .syft.yaml

      - name: Lint Dockerfile with Hadolint
        id: hadolint
        if: ${{ inputs.run_hadolint == 'true' && inputs.IMAGE != '' && (inputs.dockerfile_path != '' || steps.extract-dockerfile.outputs.dockerfile_path != '') }}
        env:
          USER_DOCKERFILE: ${{ inputs.dockerfile_path }}
          EXTRACTED_DOCKERFILE: ${{ steps.extract-dockerfile.outputs.dockerfile_path }}
        run: |
          DOCKERFILE="${USER_DOCKERFILE:-$EXTRACTED_DOCKERFILE}"
          hadolint --format json "$DOCKERFILE" \
            > "${{ github.event.repository.name }}-hadolint.json" || true

      - name: Upload Hadolint Artifact
        if: ${{ inputs.run_hadolint == 'true' && inputs.IMAGE != '' && (inputs.dockerfile_path != '' || steps.extract-dockerfile.outputs.dockerfile_path != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: hadolint-json-report-${{ inputs.project_name }}
          path: ${{ github.event.repository.name }}-hadolint.json

      - name: Run Dockle scan and generate JSON report
        if: ${{ inputs.run_dockle == 'true' && inputs.IMAGE != '' }}
        env:
          DOCKLE_VERSION: 0.4.15
        run: |
          # Scan the image tarball saved above instead of the live daemon or the
          # registry. This avoids two failure modes:
          #   1. Dockle's daemon read failing (e.g. disk pressure with large images) and
          #      silently falling back to a bogus docker.io pull -> "requested access ... denied".
          #   2. Digest (@sha256:) re-validation failing on ACR/multi-arch manifest lists.
          curl -sSfL "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin dockle
          dockle --input /tmp/sbom-image.tar \
            -f json \
            -o "${{ github.event.repository.name }}-dockle.json" \
            --exit-code 0

      - name: Upload Dockle Artifact
        if: ${{ inputs.run_dockle == 'true' && inputs.IMAGE != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dockle-report-${{ inputs.project_name }}
          path: ${{ github.event.repository.name }}-dockle.json

      - name: Add SHA-256 image digest to SBOM
        if: ${{ inputs.generate_sbom == 'true' && inputs.IMAGE != '' }}
        env:
          REG_USER: ${{ inputs.REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
          REG_REGION: ${{ inputs.REGISTRY_REGION }}
          IMAGE: ${{ inputs.IMAGE }}
        run: |
          SBOM_FILE="${{ github.event.repository.name }}-sbom.cdx.json"
          DIGEST_TOOL="${{ inputs.digest_tool }}"

          # Try the digest Syft already embedded first (fast, no network call)
          DIGEST=$(jq -r '(.metadata.component.hashes // [])[] | select(.alg == "SHA-256") | .content' "$SBOM_FILE" 2>/dev/null | head -1)

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "No digest in Syft SBOM; querying via $DIGEST_TOOL..."
            if [ "$DIGEST_TOOL" = "docker" ]; then
              DIGEST=$(docker inspect "$IMAGE" \
                | jq -r '.[0].RepoDigests[0]' \
                | cut -d'@' -f2)
            else
              # Default: skopeo queries the registry manifest directly — no credential storage
              if [[ "$IMAGE" == *".amazonaws.com"* ]]; then
                if [[ "$REG_USER" == "AWS" ]]; then
                  ECR_TOKEN="$REG_PASS"
                else
                  ECR_TOKEN=$(AWS_ACCESS_KEY_ID="$REG_USER" AWS_SECRET_ACCESS_KEY="$REG_PASS" \
                    aws ecr get-login-password --region "$REG_REGION")
                fi
                DIGEST=$(skopeo inspect --username "AWS" --password "$ECR_TOKEN" \
                  docker://"$IMAGE" | jq -r '.Digest')
              else
                DIGEST=$(skopeo inspect --username "$REG_USER" --password "$REG_PASS" \
                  docker://"$IMAGE" | jq -r '.Digest')
              fi
            fi
          fi

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "ERROR: RepoDigest not found"
            exit 1
          fi

          # Strip algorithm prefix — CoreStack validates content as bare hex only
          DIGEST="${DIGEST#sha256:}"

          echo "::notice::Image RepoDigest (SHA-256): $DIGEST"

          jq --arg digest "$DIGEST" '
            .metadata.component.hashes //= [] |
            if (.metadata.component.hashes | map(select(.alg == "SHA-256" and .content == $digest)) | length) == 0
            then .metadata.component.hashes += [{"alg": "SHA-256", "content": $digest}]
            else .
            end
          ' "$SBOM_FILE" > /tmp/sbom-cdx-digest.json

          mv /tmp/sbom-cdx-digest.json "$SBOM_FILE"
          echo "SHA-256 digest added to SBOM."

      - name: Upload SBOM Artifact
        if: ${{ inputs.generate_sbom == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cdx-${{ inputs.project_name }}
          path: ${{ github.event.repository.name }}-sbom.cdx.json

      - name: Generate Summary
        run: |
          {
            echo "## Create SBOM complete"
            if [ "${{ inputs.generate_sbom }}" == "true" ]; then
              echo "- **SBOM Artifact:** sbom-cdx-${{ inputs.project_name }} (${{ github.event.repository.name }}-sbom.cdx.json)"
            else
              echo "- SBOM generation skipped (generate_sbom=false)"
            fi
            if [ "${{ inputs.IMAGE }}" != '' ]; then
              if [ "${{ inputs.run_hadolint }}" == "true" ]; then
                echo "- **Hadolint Artifact:** hadolint-json-report-${{ inputs.project_name }}"
              fi
              if [ "${{ inputs.run_dockle }}" == "true" ]; then
                echo "- **Dockle Artifact:** dockle-report-${{ inputs.project_name }}"
              fi
            fi
          } >> $GITHUB_STEP_SUMMARY
