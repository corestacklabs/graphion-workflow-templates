name: Upload SBOM to CoreStack AppSecOps

on:
  workflow_call:
    secrets:
      CORESTACK_ACCESS_KEY:
        description: "API Access key from a CoreStack user"
        required: false
      CORESTACK_SECRET_KEY:
        description: "API Secret key from a CoreStack user"
        required: false
    inputs:
      project_name:
        description: 'AppSecOps project name (e.g. Payment Service) - used to resolve project_id, and as the tag to find artifacts produced by scan-sbom.yml/create-sbom.yml (sbom-scanned-<project_name>, hadolint-json-report-<project_name>, dockle-report-<project_name>)'
        type: string
        required: true
      project_tags:
        description: 'Optional tag filter to disambiguate project lookup when names collide (e.g. "service=governance"). Parsed as key=value and sent as tags filter to the projects/list API.'
        type: string
        required: false
        default: ''
      run_hadolint:
        description: 'Look for and attach a Hadolint report artifact (true/false) - must match what was passed to create-sbom.yml'
        type: string
        required: false
        default: 'true'
      run_dockle:
        description: 'Look for and attach a Dockle report artifact (true/false) - must match what was passed to create-sbom.yml'
        type: string
        required: false
        default: 'true'
      sbom_definition_name:
        description: 'Name for the SBOM definition (defaults to filename without extension)'
        type: string
        required: false
        default: ''
      sbom_definition_tags:
        description: 'Optional tag filter to disambiguate SBOM definition lookup when names collide (e.g. "service=governance"). Parsed as key=value and sent as tags filter to the sbom_definition/list API.'
        type: string
        required: false
        default: ''
      build_id:
        description: 'Build/version identifier override. Alphanumeric and " .-+", 3-50 chars (e.g. "myapp v2" or "2.02-beta"). If omitted, auto-set to "1.0.0".'
        type: string
        required: false
        default: ''
      api_base_url:
        description: 'CoreStack API base URL'
        type: string
        required: false
        default: 'https://api.corestack.io'
      force_upload:
        description: 'Allow upload if same content exists elsewhere (true/false)'
        type: string
        required: false
        default: 'false'
      sanitize_licenses:
        description: 'Strip invalid SPDX license entries from the SBOM before upload (true/false)'
        type: string
        required: false
        default: 'false'

env:
  API_BASE: ${{ inputs.api_base_url }}

jobs:
  upload-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          if [[ -z "${{ inputs.project_name }}" ]]; then
            echo "Error: 'project_name' is required."
            exit 1
          fi
          if [[ -z "${{ secrets.CORESTACK_ACCESS_KEY }}" ]]; then
            echo "Error: 'CORESTACK_ACCESS_KEY' is required for SBOM upload."
            exit 1
          fi
          if [[ -z "${{ secrets.CORESTACK_SECRET_KEY }}" ]]; then
            echo "Error: 'CORESTACK_SECRET_KEY' is required for SBOM upload."
            exit 1
          fi

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-${{ inputs.project_name }}"
          merge-multiple: true
          path: .

      - name: Validate SBOM file exists
        id: validate
        run: |
          # CoreStack requires the SBOM to be vulnerability-scanned before upload,
          # so only the Grype output (sbom-scanned-<project_name>, produced by
          # scan-sbom.yml) is accepted. A customer-supplied SBOM still needs to go
          # through scan-sbom.yml first — land it in an sbom-cdx-<project_name>
          # artifact so scan-sbom.yml can pick it up, same as create-sbom.yml's output.
          FILENAME="${{ github.event.repository.name }}-sbom.json"
          if [ ! -f "$FILENAME" ]; then
            echo "::error::No scanned SBOM found ($FILENAME). Run scan-sbom.yml before upload-sbom.yml — expected artifact sbom-scanned-${{ inputs.project_name }}."
            exit 1
          fi

          HADOLINT_EXISTS=false
          if [[ "${{ inputs.run_hadolint }}" == "true" && -f "${{ github.event.repository.name }}-hadolint.json" ]]; then
            HADOLINT_EXISTS=true
          fi
          DOCKLE_EXISTS=false
          if [[ "${{ inputs.run_dockle }}" == "true" && -f "${{ github.event.repository.name }}-dockle.json" ]]; then
            DOCKLE_EXISTS=true
          fi

          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "hadolint_exists=$HADOLINT_EXISTS" >> $GITHUB_OUTPUT
          echo "dockle_exists=$DOCKLE_EXISTS" >> $GITHUB_OUTPUT
          echo "sbom_name=${{ github.event.repository.name }}-sbom" >> $GITHUB_OUTPUT
          echo "SBOM file validated: $FILENAME"

      - name: Sanitize SBOM license entries
        if: ${{ inputs.sanitize_licenses == 'true' }}
        run: |
          SBOM_FILE="${{ steps.validate.outputs.filename }}"

          # The API uses JsonStrictValidator(SchemaVersion.V1_6) from cyclonedx-python-lib.
          # Fetch the valid SPDX license IDs from the same CycloneDX 1.6 schema it validates against.
          # The schema embeds the SPDX enum; any id not in that enum fails strict validation.
          VALID_IDS=$(curl -sSf --max-time 15 \
            "https://cyclonedx.org/schema/bom-1.6.schema.json" \
            | jq '[.. | objects | select(has("enum")) | .enum[] | select(type == "string")] | unique' \
            2>/dev/null)

          # Fall back to pinned SPDX list if schema fetch fails
          if [ -z "$VALID_IDS" ] || [ "$VALID_IDS" = "null" ] || [ "$VALID_IDS" = "[]" ]; then
            echo "::warning::CycloneDX schema fetch failed; falling back to SPDX v3.24.0 license list."
            VALID_IDS=$(curl -sSf --max-time 15 \
              "https://raw.githubusercontent.com/spdx/license-list-data/v3.24.0/json/licenses.json" \
              | jq '[.licenses[].licenseId]' 2>/dev/null)
          fi

          if [ -z "$VALID_IDS" ] || [ "$VALID_IDS" = "null" ] || [ "$VALID_IDS" = "[]" ]; then
            echo "::warning::All license ID fetches failed; removing only name-only license entries."
            jq '
              walk(
                if type == "object" and has("licenses") then
                  .licenses |= map(select(.expression != null or (.license | has("id")))) |
                  if (.licenses | length) == 0 then del(.licenses) else . end
                else . end
              )
            ' "$SBOM_FILE" > /tmp/sbom-clean.json
          else
            jq --argjson valid "$VALID_IDS" '
              walk(
                if type == "object" and has("licenses") then
                  .licenses |= map(select(
                    (.expression != null) or
                    ((.license | has("id")) and (.license.id | IN($valid[])))
                  )) |
                  if (.licenses | length) == 0 then del(.licenses) else . end
                else . end
              )
            ' "$SBOM_FILE" > /tmp/sbom-clean.json
          fi

          mv /tmp/sbom-clean.json "$SBOM_FILE"
          echo "License sanitization complete."

      - name: Get CoreStack auth token
        id: auth
        env:
          ACCESS_KEY: ${{ secrets.CORESTACK_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.CORESTACK_SECRET_KEY }}
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ env.API_BASE }}/v1/auth/tokens" \
            -H "Content-Type: application/json" \
            -d "{\"access_key\":\"$ACCESS_KEY\",\"secret_key\":\"$SECRET_KEY\"}")
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Auth failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          # Postman: token.access_token, user.active_tenant_id
          TOKEN=$(echo "$BODY" | jq -r '.token.access_token // .data.token.access_token // .data.key // .key // .access_token // empty')
          TENANT_ID=$(echo "$BODY" | jq -r '.user.active_tenant_id // .data.user.active_tenant_id // empty')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::No token in response: $BODY"
            exit 1
          fi
          if [ -z "$TENANT_ID" ] || [ "$TENANT_ID" = "null" ]; then
            echo "::error::No tenant_id in response: $BODY"
            exit 1
          fi
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "tenant_id=$TENANT_ID" >> $GITHUB_OUTPUT
          echo "Auth token and tenant_id obtained successfully."

      - name: Get Project ID by Name
        id: project
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}
          TENANT_ID: ${{ steps.auth.outputs.tenant_id }}
        run: |
          TAG_INPUT="${{ inputs.project_tags }}"
          if [ -n "$TAG_INPUT" ]; then
            TAG_KEY="${TAG_INPUT%%=*}"
            TAG_VAL="${TAG_INPUT#*=}"
            echo "Applying tag filter: $TAG_KEY=$TAG_VAL"
            BODY=$(jq -n \
              --arg tenant_id "$TENANT_ID" \
              --arg project_name "${{ inputs.project_name }}" \
              --arg tag_key "$TAG_KEY" \
              --arg tag_val "$TAG_VAL" \
              '{
                filters: { tenant_id: $tenant_id, name: [$project_name], tags: [{ key: $tag_key, value: $tag_val }] },
                list_context: { batch_size: 10, batch_offset: 0 }
              }')
          else
            BODY=$(jq -n \
              --arg tenant_id "$TENANT_ID" \
              --arg project_name "${{ inputs.project_name }}" \
              '{
                filters: { tenant_id: $tenant_id, name: [$project_name] },
                list_context: { batch_size: 10, batch_offset: 0 }
              }')
          fi
          RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ env.API_BASE }}/v1/appsecops/projects/list" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: $AUTH_TOKEN" \
            -d "$BODY")
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          RESP_BODY=$(echo "$RESP" | sed '$d')
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Get project failed (HTTP $HTTP_CODE): $RESP_BODY"
            exit 1
          fi
          RESULT_COUNT=$(echo "$RESP_BODY" | jq '(.data.results // .results) | length')
          if [ "$RESULT_COUNT" -eq 0 ]; then
            echo "::error::No project found for project_name: ${{ inputs.project_name }}"
            exit 1
          fi

          if [ "$RESULT_COUNT" -gt 1 ]; then
            echo "::warning::$RESULT_COUNT IDs returned for name filter '${{ inputs.project_name }}' — API uses substring matching. Using [0]; verify it is the correct project."
          fi
          PROJECT_ID=$(echo "$RESP_BODY" | jq -r '(.data.results // .results)[0]')
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "::error::No project ID in results: $RESP_BODY"
            exit 1
          fi
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "Project ID: $PROJECT_ID"

          # Log the actual project name for this ID so mismatches are visible in the workflow log.
          ITEM_RESP=$(curl -s -X GET \
            "${{ env.API_BASE }}/v1/appsecops/projects/item/${PROJECT_ID}" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: $AUTH_TOKEN")
          ACTUAL_NAME=$(echo "$ITEM_RESP" | jq -r '.name // .data.name // "unknown"')
          echo "Resolved project name: $ACTUAL_NAME"
          if [ "$ACTUAL_NAME" != "${{ inputs.project_name }}" ] && [ "$ACTUAL_NAME" != "unknown" ]; then
            echo "::warning::Project name mismatch — expected '${{ inputs.project_name }}' but resolved '$ACTUAL_NAME' (ID: $PROJECT_ID). Check that the tag filter is applied to the correct project in CoreStack."
          fi

      - name: Create or Find SBOM Definition
        id: sbom-def
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}
          TENANT_ID: ${{ steps.auth.outputs.tenant_id }}
        run: |
          SBOM_NAME="${{ inputs.sbom_definition_name }}"
          if [ -z "$SBOM_NAME" ]; then
            SBOM_NAME="${{ steps.validate.outputs.sbom_name }}"
          fi
          PROJECT_ID="${{ steps.project.outputs.project_id }}"
          PROJECT_NAME="${{ inputs.project_name }}"

          # Step 1: Proactively look up existing SBOM definition by name + project.
          # When sbom_definition_tags is provided, include it in the filter to
          # disambiguate definitions whose names collide across projects.
          SBOM_TAG_INPUT="${{ inputs.sbom_definition_tags }}"
          if [ -n "$SBOM_TAG_INPUT" ]; then
            SBOM_TAG_KEY="${SBOM_TAG_INPUT%%=*}"
            SBOM_TAG_VAL="${SBOM_TAG_INPUT#*=}"
            echo "Applying tag filter to SBOM definition search: $SBOM_TAG_KEY=$SBOM_TAG_VAL"
            SEARCH_BODY=$(jq -n \
              --arg tenant_id "$TENANT_ID" \
              --arg search "$SBOM_NAME" \
              --arg project_id "$PROJECT_ID" \
              --arg tag_key "$SBOM_TAG_KEY" \
              --arg tag_val "$SBOM_TAG_VAL" \
              '{
                list_context: { batch_size: 100, batch_offset: 0 },
                filters: { tenant_id: $tenant_id, search: $search, appsecops_project_id: $project_id, tags: [{ key: $tag_key, value: $tag_val }] }
              }')
          else
            SEARCH_BODY=$(jq -n \
              --arg tenant_id "$TENANT_ID" \
              --arg search "$SBOM_NAME" \
              --arg project_id "$PROJECT_ID" \
              '{
                list_context: { batch_size: 100, batch_offset: 0 },
                filters: { tenant_id: $tenant_id, search: $search, appsecops_project_id: $project_id }
              }')
          fi
          SEARCH_RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ env.API_BASE }}/v1/appsecops/sbom_definition/list" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: $AUTH_TOKEN" \
            -d "$SEARCH_BODY")
          SEARCH_HTTP_CODE=$(echo "$SEARCH_RESP" | tail -n1)
          SEARCH_RESP_BODY=$(echo "$SEARCH_RESP" | sed '$d')
          SBOM_DEF_ID=""

          if [ "$SEARCH_HTTP_CODE" -ge 200 ] && [ "$SEARCH_HTTP_CODE" -lt 300 ]; then
            # Prefer exact name match; fall back to first result for plain-string ID arrays.
            MATCH=$(echo "$SEARCH_RESP_BODY" | jq -c \
              --arg name "$SBOM_NAME" \
              '(.data.results // .results)
               | map(select(type == "object" and (.name == $name or .sbom_definition_name == $name)))
               | .[0] // empty')
            if [ -z "$MATCH" ] || [ "$MATCH" = "null" ]; then
              MATCH=$(echo "$SEARCH_RESP_BODY" | jq -c '(.data.results // .results)[0] // empty')
            fi
            if [ -n "$MATCH" ] && [ "$MATCH" != "null" ]; then
              MATCH_TYPE=$(echo "$MATCH" | jq -r 'type')
              if [ "$MATCH_TYPE" = "object" ]; then
                SBOM_DEF_ID=$(echo "$MATCH" | jq -r '.sbom_definition_id // .id // empty')
              else
                SBOM_DEF_ID=$(echo "$MATCH" | jq -r '.')
              fi
            fi
          fi

          if [ -n "$SBOM_DEF_ID" ] && [ "$SBOM_DEF_ID" != "null" ]; then
            echo "Existing SBOM definition found: $SBOM_DEF_ID"
          else
            # No existing definition found — create a new one.
            DESCRIPTION="SBOM for ${{ inputs.project_name }}"
            CREATE_BODY=$(jq -n \
              --arg name "$SBOM_NAME" \
              --arg tenant_id "$TENANT_ID" \
              --arg project_id "$PROJECT_ID" \
              --arg description "$DESCRIPTION" \
              '{
                name: $name,
                description: $description,
                tenant_id: $tenant_id,
                appsecops_project_id: $project_id,
                tags: []
              }')
            RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ env.API_BASE }}/v1/appsecops/sbom_definition/create" \
              -H "Content-Type: application/json" \
              -H "X-Auth-Token: $AUTH_TOKEN" \
              -d "$CREATE_BODY")
            HTTP_CODE=$(echo "$RESP" | tail -n1)
            RESP_BODY=$(echo "$RESP" | sed '$d')

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              # Fallback — create failed with a known "already exists/associated" error.
              # Handles both:
              #   "SBOM name already exists; Please use a unique name"
              #   "Project is already associated with another SBOM definition"
              ERROR_MSG=$(echo "$RESP_BODY" | jq -r '.message // empty')
              if echo "$ERROR_MSG" | grep -qiE "already exists|already associated"; then
                echo "::warning::Create returned '$ERROR_MSG' — searching for existing definition by project_id."
                FALLBACK_BODY=$(jq -n \
                  --arg tenant_id "$TENANT_ID" \
                  --arg project_id "$PROJECT_ID" \
                  '{
                    list_context: { batch_size: 100, batch_offset: 0 },
                    filters: { tenant_id: $tenant_id, appsecops_project_id: $project_id }
                  }')
                FB_RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ env.API_BASE }}/v1/appsecops/sbom_definition/list" \
                  -H "Content-Type: application/json" \
                  -H "X-Auth-Token: $AUTH_TOKEN" \
                  -d "$FALLBACK_BODY")
                FB_HTTP_CODE=$(echo "$FB_RESP" | tail -n1)
                FB_RESP_BODY=$(echo "$FB_RESP" | sed '$d')
                if [ "$FB_HTTP_CODE" -lt 200 ] || [ "$FB_HTTP_CODE" -ge 300 ]; then
                  echo "::error::Fallback search for SBOM definition failed (HTTP $FB_HTTP_CODE): $FB_RESP_BODY"
                  exit 1
                fi
                FB_FIRST=$(echo "$FB_RESP_BODY" | jq -c '(.data.results // .results)[0] // empty')
                if [ -z "$FB_FIRST" ] || [ "$FB_FIRST" = "null" ]; then
                  echo "::error::No existing SBOM definition found for project '$PROJECT_ID': $FB_RESP_BODY"
                  exit 1
                fi
                FB_TYPE=$(echo "$FB_FIRST" | jq -r 'type')
                if [ "$FB_TYPE" = "object" ]; then
                  SBOM_DEF_ID=$(echo "$FB_FIRST" | jq -r '.sbom_definition_id // .id // empty')
                else
                  SBOM_DEF_ID=$(echo "$FB_FIRST" | jq -r '.')
                fi
                if [ -z "$SBOM_DEF_ID" ] || [ "$SBOM_DEF_ID" = "null" ]; then
                  echo "::error::Fallback result had no valid ID for project '$PROJECT_ID': $FB_RESP_BODY"
                  exit 1
                fi
                echo "Found existing SBOM definition via fallback: $SBOM_DEF_ID"
              else
                echo "::error::Create SBOM definition failed (HTTP $HTTP_CODE): $RESP_BODY"
                exit 1
              fi
            else
              SBOM_DEF_ID=$(echo "$RESP_BODY" | jq -r '.data.sbom_definition_id // .data.id // .sbom_definition_id // .id // empty')
              if [ -z "$SBOM_DEF_ID" ] || [ "$SBOM_DEF_ID" = "null" ]; then
                echo "::error::No sbom_definition_id in create response: $RESP_BODY"
                exit 1
              fi
              echo "Created new SBOM definition: $SBOM_DEF_ID"
            fi
          fi

          echo "sbom_definition_id=$SBOM_DEF_ID" >> $GITHUB_OUTPUT
          echo "SBOM Definition ID: $SBOM_DEF_ID"

      - name: Get current SBOM version number and build ID
        id: get-version
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          SBOM_DEF_ID="${{ steps.sbom-def.outputs.sbom_definition_id }}"

          # Step 1: GET definition item → extract release_version_id (ID of the latest uploaded version).
          DEF_RESP=$(curl -s -w "\n%{http_code}" -X GET "${{ env.API_BASE }}/v1/appsecops/sbom_definition/item/${SBOM_DEF_ID}" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: $AUTH_TOKEN")
          DEF_HTTP_CODE=$(echo "$DEF_RESP" | tail -n1)
          DEF_BODY=$(echo "$DEF_RESP" | sed '$d')

          RELEASE_VERSION_ID=""
          # version_number always starts at 1, so default to 0 only when no versions exist yet.
          CURRENT_VERSION_NUM=0

          if [ "$DEF_HTTP_CODE" -ge 200 ] && [ "$DEF_HTTP_CODE" -lt 300 ]; then
            RELEASE_VERSION_ID=$(echo "$DEF_BODY" | jq -r '.release_version_id // .data.release_version_id // empty')
          else
            echo "::warning::Could not fetch definition item (HTTP $DEF_HTTP_CODE) — assuming no existing versions."
          fi

          if [ -n "$RELEASE_VERSION_ID" ] && [ "$RELEASE_VERSION_ID" != "null" ]; then
            # Step 2: GET version item → read version_number (always >= 1).
            VER_RESP=$(curl -s -w "\n%{http_code}" -X GET "${{ env.API_BASE }}/v1/appsecops/sbom_version/item/${RELEASE_VERSION_ID}" \
              -H "Content-Type: application/json" \
              -H "X-Auth-Token: $AUTH_TOKEN")
            VER_HTTP_CODE=$(echo "$VER_RESP" | tail -n1)
            VER_BODY=$(echo "$VER_RESP" | sed '$d')
            if [ "$VER_HTTP_CODE" -ge 200 ] && [ "$VER_HTTP_CODE" -lt 300 ]; then
              CURRENT_VERSION_NUM=$(echo "$VER_BODY" | jq -r '.version_number // .data.version_number // 1')
              CURRENT_BUILD_ID=$(echo "$VER_BODY" | jq -r '.build_id // .data.build_id // 1')
            else
              # release_version_id exists so at least 1 version is present — default to 1.
              echo "::warning::Could not fetch version item (HTTP $VER_HTTP_CODE) — release_version_id is set, defaulting to version 1."
              CURRENT_VERSION_NUM=1
              CURRENT_BUILD_ID="1"
            fi
          else
            echo "No existing SBOM versions — this upload will be version 1."
          fi

          NEXT_VERSION=$((CURRENT_VERSION_NUM + 1))
          echo "release_version_id=$RELEASE_VERSION_ID" >> $GITHUB_OUTPUT
          echo "current_version_num=$CURRENT_VERSION_NUM" >> $GITHUB_OUTPUT
          echo "current_build_id=$CURRENT_BUILD_ID" >> $GITHUB_OUTPUT
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION_NUM → next version: $NEXT_VERSION"
          echo "Current build id: $CURRENT_BUILD_ID"

      - name: Format build number
        id: format-build-number
        run: |
          BUILD_ID="${{ inputs.build_id }}"
          NEXT_VERSION="${{ steps.get-version.outputs.next_version }}"
          if [ -z "$BUILD_ID" ]; then
            # pull from previous version
            BUILD_ID="${{ steps.get-version.outputs.current_build_id }}"
            # If the current build ID is the default "1"
            if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "1" ]; then
              BUILD_ID='1.0.0'
            fi
          fi
          # strip "build ", extra spaces, and special characters except . and - which are common in version numbers (e.g. 1.0.0, 2.1.3-beta)
          FORMATTED_BUILD_ID=$(echo "$BUILD_ID" | sed 's/^build[[:space:]]*//I' | tr -s ' ' \
          | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr -cd '[:alnum:]+-. ' | cut -c1-50)
          # if length is less than 3 chars, append ".0.${NEXT_VERSION}" to meet API requirement of at least 3 chars
          if [ ${#FORMATTED_BUILD_ID} -lt 3 ]; then
            FORMATTED_BUILD_ID="${FORMATTED_BUILD_ID}.0.${NEXT_VERSION}"
          else
            # if the last character is a number, increase the trailing numeric segment by 1
            if [[ "${FORMATTED_BUILD_ID}" =~ [0-9]$ ]]; then
              LAST_NUM=$(echo "$FORMATTED_BUILD_ID" | grep -oE '[0-9]+$')
              PREFIX=$(echo "$FORMATTED_BUILD_ID" | sed 's/[0-9]*$//')
              NEXT_NUM=$((10#$LAST_NUM + 1))
              # preserve zero-padding width (e.g. "01"→"02", "09"→"10")
              if [[ ${#LAST_NUM} -gt 1 && "$LAST_NUM" =~ ^0 ]]; then
                NEXT_NUM=$(printf "%0${#LAST_NUM}d" $NEXT_NUM)
              fi
              FORMATTED_BUILD_ID="${PREFIX}${NEXT_NUM}"
            else
              # if the last character is not a number, find the first number from the right and increment it, otherwise append NEXT_VERSION
              LAST_NUMBER=$(echo "$FORMATTED_BUILD_ID" | grep -oE '[0-9]' | tail -1)
              if [ -n "$LAST_NUMBER" ]; then
                FORMATTED_BUILD_ID=$(echo "$FORMATTED_BUILD_ID" | sed "s/\(.*\\)$LAST_NUMBER/\\1$((LAST_NUMBER + 1))/")
              else
                FORMATTED_BUILD_ID="${FORMATTED_BUILD_ID}.${NEXT_VERSION}"
              fi
            fi
          fi
          # Output the formatted buid id to be used in subsequent steps
          echo "formatted_build_id=$FORMATTED_BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID formatted: $FORMATTED_BUILD_ID"

      - name: Create and Upload Attachments
        id: attachments
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}
          REPO_NAME: ${{ github.event.repository.name }}
          SBOM_FILENAME: ${{ steps.validate.outputs.filename }}
          HADOLINT_EXISTS: ${{ steps.validate.outputs.hadolint_exists }}
          DOCKLE_EXISTS: ${{ steps.validate.outputs.dockle_exists }}
        run: |
          attach_and_upload() {
            local FILENAME="$1"
            local DISPLAY_NAME="${2:-$1}"
            local RESP HTTP_CODE BODY ATTACHMENT_ID
            RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ env.API_BASE }}/v1/attachment/create" \
              -H "Content-Type: application/json" \
              -H "X-Auth-Token: $AUTH_TOKEN" \
              -d "{\"name\":\"$DISPLAY_NAME\",\"file_name\":\"$DISPLAY_NAME\"}")
            HTTP_CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | sed '$d')
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Create attachment failed for $FILENAME (HTTP $HTTP_CODE): $BODY"
              exit 1
            fi
            ATTACHMENT_ID=$(echo "$BODY" | jq -r '.id // .data.id // empty')
            if [ -z "$ATTACHMENT_ID" ] || [ "$ATTACHMENT_ID" = "null" ]; then
              echo "::error::No attachment id in response for $FILENAME: $BODY"
              exit 1
            fi
            RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ env.API_BASE }}/v1/attachment/item/$ATTACHMENT_ID/stream" \
              -H "X-Auth-Token: $AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$FILENAME")
            HTTP_CODE=$(echo "$RESP" | tail -n1)
            BODY=$(echo "$RESP" | sed '$d')
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::error::Upload stream failed for $FILENAME (HTTP $HTTP_CODE): $BODY"
              exit 1
            fi
            echo "$ATTACHMENT_ID"
          }

          PROJECT_SLUG=$(echo "${{ inputs.project_name }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          SBOM_ID=$(attach_and_upload "$SBOM_FILENAME" "${PROJECT_SLUG}-sbom.json")
          echo "sbom_attachment_id=$SBOM_ID" >> $GITHUB_OUTPUT
          echo "SBOM attachment uploaded: $SBOM_ID"

          if [ "$HADOLINT_EXISTS" = "true" ]; then
            HADOLINT_ID=$(attach_and_upload "${REPO_NAME}-hadolint.json")
            echo "hadolint_attachment_id=$HADOLINT_ID" >> $GITHUB_OUTPUT
            echo "Hadolint attachment uploaded: $HADOLINT_ID"
          fi

          if [ "$DOCKLE_EXISTS" = "true" ]; then
            DOCKLE_ID=$(attach_and_upload "${REPO_NAME}-dockle.json")
            echo "dockle_attachment_id=$DOCKLE_ID" >> $GITHUB_OUTPUT
            echo "Dockle attachment uploaded: $DOCKLE_ID"
          fi

      - name: Upload SBOM Version
        id: sbom-version
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          FORCE=false
          if [ "${{ inputs.force_upload }}" = "true" ]; then
            FORCE=true
          fi
          # Postman: sbom_file_format with __type AppSecopsSbomVersionFileFormatForCycloneDX, version 1.6
          BODY=$(jq -n \
            --arg tenant_id "${{ steps.auth.outputs.tenant_id }}" \
            --arg sbom_definition_id "${{ steps.sbom-def.outputs.sbom_definition_id }}" \
            --arg attachment_id "${{ steps.attachments.outputs.sbom_attachment_id }}" \
            --arg build_id "${{ steps.format-build-number.outputs.formatted_build_id }}" \
            --argjson force $FORCE \
            '{
              tenant_id: $tenant_id,
              sbom_definition_id: $sbom_definition_id,
              attachment_id: $attachment_id,
              sbom_file_format: { __type: "AppSecopsSbomVersionFileFormatForCycloneDX", version: "1.6" },
              build_id: $build_id,
              force: $force
            }')
          RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ env.API_BASE }}/v1/appsecops/sbom_version/create" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: $AUTH_TOKEN" \
            -d "$BODY")
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          RESP_BODY=$(echo "$RESP" | sed '$d')
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Create SBOM version failed (HTTP $HTTP_CODE): $RESP_BODY"
            exit 1
          fi
          VERSION_ID=$(echo "$RESP_BODY" | jq -r '.data.sbom_version_id // .data.id // .sbom_version_id // .id // empty')
          VERSION_NUMBER=$(echo "$RESP_BODY" | jq -r '.data.version_number // .version_number // empty')
          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "SBOM version created successfully."

      - name: Upload Container Findings to SBOM Version
        if: ${{ steps.validate.outputs.dockle_exists == 'true' || steps.validate.outputs.hadolint_exists == 'true' }}
        id: container_findings
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}
          DOCKLE_EXISTS: ${{ steps.validate.outputs.dockle_exists }}
          HADOLINT_EXISTS: ${{ steps.validate.outputs.hadolint_exists }}
          DOCKLE_ATTACHMENT_ID: ${{ steps.attachments.outputs.dockle_attachment_id }}
          HADOLINT_ATTACHMENT_ID: ${{ steps.attachments.outputs.hadolint_attachment_id }}
        run: |
          FINDINGS='[]'
          if [ "$DOCKLE_EXISTS" = "true" ]; then
            FINDINGS=$(echo "$FINDINGS" | jq \
              --arg id "$DOCKLE_ATTACHMENT_ID" \
              '. + [{"__type": "ContainerFindingsForDockle", "file_format": "json", "attachment_id": $id}]')
          fi
          if [ "$HADOLINT_EXISTS" = "true" ]; then
            FINDINGS=$(echo "$FINDINGS" | jq \
              --arg id "$HADOLINT_ATTACHMENT_ID" \
              '. + [{"__type": "ContainerFindingsForHadolint", "file_format": "json", "attachment_id": $id}]')
          fi
          BODY=$(jq -n \
            --arg tenant_id "${{ steps.auth.outputs.tenant_id }}" \
            --arg sbom_version_id "${{ steps.sbom-version.outputs.version_id }}" \
            --argjson findings "$FINDINGS" \
            '{
              "tenant_id": $tenant_id,
              "sbom_version_id": $sbom_version_id,
              "container_findings": $findings
            }')
          RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ env.API_BASE }}/v1/appsecops/container/findings/ingest" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Token: $AUTH_TOKEN" \
            -d "$BODY")
          HTTP_CODE=$(echo "$RESP" | tail -n1)
          RESP_BODY=$(echo "$RESP" | sed '$d')
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Upload Container Findings failed (HTTP $HTTP_CODE): $RESP_BODY"
            exit 1
          fi
          ATTACHMENT_ID=$(echo "$RESP_BODY" | jq -r '.[0].attachment_id')
          echo "attachment_id=$ATTACHMENT_ID" >> $GITHUB_OUTPUT
          echo "Container findings uploaded successfully."

      - name: Summary
        run: |
          {
            echo "## SBOM upload complete"
            echo "- **Project ID:** ${{ steps.project.outputs.project_id }}"
            echo "- **SBOM Definition ID:** ${{ steps.sbom-def.outputs.sbom_definition_id }}"
            PREV_REL="${{ steps.get-version.outputs.release_version_id }}"
            if [ -z "$PREV_REL" ]; then
              echo "- **Previous Version:** None (first upload)"
            else
              echo "- **Previous Version:** ${{ steps.get-version.outputs.current_version_num }} (release_version_id: $PREV_REL)"
            fi
            echo "- **Uploaded as Version:** ${{ steps.sbom-version.outputs.version_number }}"
            echo "- **SBOM Version ID:** ${{ steps.sbom-version.outputs.version_id }}"
            echo "- **Build ID:** ${{ steps.format-build-number.outputs.formatted_build_id }}"
          } >> $GITHUB_STEP_SUMMARY
